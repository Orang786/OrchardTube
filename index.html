<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrchardTube</title>
<meta name="description" content="OrchardTube — видеоплатформа с оранжевым характером.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff6b00'/%3E%3Cpath d='M13 9.5v13l10-6.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=30">
<script src="js/icons.js?v=30"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="menuBtn" aria-label="Свернуть меню" title="Меню">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <a class="logo" href="#/" aria-label="OrchardTube — главная">
      <span class="logo-mark"><svg class="ic"><use href="#i-play"/></svg></span>
      <span class="logo-text">Orchard<span>Tube</span></span>
      <span class="logo-country">RU</span>
    </a>
  </div>

  <form class="search" id="searchForm" role="search" autocomplete="off">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Введите запрос" aria-label="Поиск" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">/</kbd>
    </div>
    <div class="search-ac" id="searchAC" hidden></div>
    <button class="icon-btn search-btn" type="submit" aria-label="Найти" title="Найти">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>
  </form>

  <div class="topbar-right">
    <button class="pill-btn create-btn" id="createBtn">
      <svg class="ic"><use href="#i-plus"/></svg><span>Создать</span>
    </button>
    <button class="icon-btn bell" id="bellBtn" aria-label="Уведомления">
      <svg class="ic"><use href="#i-bell"/></svg>
    </button>
    <button class="pill-btn login-btn" id="loginBtn">Войти</button>
    <button class="avatar-btn" id="avatarBtn" aria-label="Аккаунт" hidden></button>
  </div>
</header>

<aside class="sidebar" id="sidebar" aria-label="Навигация">
  <nav class="side-scroll">
    <a class="side-item" href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Главная</span></a>
    <a class="side-item" href="#/subs" data-nav="subs"><svg class="ic"><use href="#i-subs"/></svg><span>Подписки</span></a>
    <div class="side-divider"></div>
    <a class="side-item" href="#/history" data-nav="history"><svg class="ic"><use href="#i-history"/></svg><span>История</span></a>
    <a class="side-item" href="#/my-videos" data-nav="my"><svg class="ic"><use href="#i-film"/></svg><span>Ваши видео</span></a>
    <a class="side-item" href="#/watch-later" data-nav="later"><svg class="ic"><use href="#i-clock"/></svg><span>Смотреть позже</span></a>
    <a class="side-item" href="#/liked" data-nav="liked"><svg class="ic"><use href="#i-thumb-up"/></svg><span>Понравившиеся</span></a>
    <div class="side-divider"></div>
    <div class="side-title side-subs-only" hidden>Подписки</div>
    <div id="sideChannels" class="side-channels"></div>
    <div class="side-divider side-subs-only" hidden></div>
    <button class="side-item side-action" id="themeBtn">
      <svg class="ic" id="themeIcon"><use href="#i-sun"/></svg><span id="themeLabel">Светлая тема</span>
    </button>
    <button class="side-item side-action" id="settingsBtn"><svg class="ic"><use href="#i-settings"/></svg><span>Настройки</span></button>
    <button class="side-item side-action" id="helpBtn"><svg class="ic"><use href="#i-help"/></svg><span>Справка</span></button>
    <div class="side-legal">
      <a href="#/legal/about">О сервисе</a><a href="#/legal/contact">Связаться</a><a href="#/legal/copyright">Авторские права</a><a href="#/legal/terms">Условия использования</a><a href="#/legal/privacy">Политика конфиденциальности</a>
    </div>
    <div class="side-footer">
      OrchardTube © 2026<br>
      Сделано с любовью к оранжевому.
    </div>
  </nav>
</aside>

<div class="scrim" id="scrim"></div>

<main class="main" id="main" tabindex="-1"></main>

<div class="popover" id="popover" hidden></div>
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js?v=30"></script>
</body>
</html>
