# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: orchardtube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI        # строка подключения MongoDB Atlas — задать в панели Render
        sync: false
      - key: MONGODB_DB
        value: orchardtube
      - key: GOOGLE_CLIENT_ID   # OAuth Client ID из Google Cloud Console — задать в панели Render
        sync: false
      - key: SESSION_SECRET     # ключ подписи сессий (сгенерируется автоматически)
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: 100
